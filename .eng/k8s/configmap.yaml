# Non-secret settings only - see src/CodeRag.Api/appsettings.json for defaults.
# ConnectionStrings__Database is injected separately from the code-rag-secrets Secret
# (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-rag-config
data:
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Development"
  Embeddings__Provider: "Ollama"
  Embeddings__Model: "bge-m3"
  Embeddings__BaseUrl: "http://192.168.1.212:11434"
  Embeddings__Dimensions: "1024"
  Embeddings__Normalized: "true"
  Embeddings__TimeoutSeconds: "30"
  Reranking__Provider: "Ollama"
  Reranking__Model: "qwen2.5:7b-instruct"
  Reranking__BaseUrl: "http://192.168.1.212:11434"
  Reranking__TimeoutSeconds: "120"
  Reranking__CandidatePoolSize: "25"
  Reranking__MaxConcurrency: "6"
  # otel-collector (observability namespace) only has a traces pipeline wired to Tempo, whose
  # metrics-generator derives the APM RED metrics (traces_spanmetrics_*) from spans - hence
  # tracing only, no metrics/logs exporter here. HttpProtobuf over the collector's plain-HTTP
  # 4318 port avoids the gRPC h2c (unencrypted HTTP/2) opt-in .NET otherwise needs for the 4317
  # port. The endpoint must carry the full /v1/traces path: a configured Endpoint is used verbatim
  # (the SDK only appends the signal path to the OTEL_EXPORTER_OTLP_ENDPOINT env var), and
  # POST / on the collector is a 404 - no trace ever reached Tempo without it.
  # Service name shown in Tempo. Comes from OTEL_SERVICE_NAME, NOT from "ApplicationName" - the
  # ASP.NET host reserves that key and always sets it to the assembly name.
  OTEL_SERVICE_NAME: "code-rag-api"
  Observability__OpenTelemetry__UseTracingExporter: "Otlp"
  Observability__OtlpExporterOptions__Endpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  Observability__OtlpExporterOptions__Protocol: "HttpProtobuf"

