# ingressClassName/host are guesses (Traefik is k3s' default, host follows the
# forgejo.home.arpa naming convention) - adjust to match your cluster's actual ingress
# controller and desired hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-rag-api
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - code-rag-api.home.arpa
      secretName: wildcard-tls
  rules:
    - host: code-rag-api.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-rag-api
                port:
                  name: http
