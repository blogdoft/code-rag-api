# Traefik doesn't apply a response-header timeout to backends by default (0s = unlimited),
# but the ingress was still returning 504s under slow reranking requests - most likely from
# whatever sits in front of this cluster's entrypoint rather than Traefik itself. Giving the
# backend an explicit, generous budget here is the documented, per-service way to raise that
# ceiling without touching the cluster-wide Traefik entrypoint config (out of this repo's
# scope). Referenced from service.yaml via the
# traefik.ingress.kubernetes.io/service.serverstransport annotation.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: code-rag-api-transport
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 90s
