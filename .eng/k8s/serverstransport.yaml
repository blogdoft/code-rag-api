# Confirmed via live testing (simulated /code-queries calls + pod logs): the app itself takes
# this long under real reranking load (Ollama running qwen2.5:7b-instruct on CPU, no GPU -
# see OllamaReranker's per-candidate logging). 90s wasn't enough margin - the backend was still
# finishing its own request (and logging an internal 500, since by then Traefik had already
# returned 504 to the client and no one was listening) up to ~90.1s in. Referenced from
# service.yaml via the traefik.ingress.kubernetes.io/service.serverstransport annotation.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: code-rag-api-transport
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 120s
