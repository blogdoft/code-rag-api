# Assumes a self-hosted act_runner labeled "docker" with access to a Docker daemon (either
# privileged mode or a mounted docker socket) - adjust `runs-on` and the registry variables
# below (Settings > Actions > Variables/Secrets) to match your Forgejo instance.
name: Build, test and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# A main push and a tag push landing close together (e.g. tagging a release right after
# pushing main) each trigger their own run of this workflow. The publish/update-gitops jobs run
# directly on the self-hosted runner host (no container isolation) and update-gitops pushes to a
# shared external repo (argo-local-apps) - two overlapping runs can race on the runner's working
# directory or clobber each other's push there. Unlike a mirror sync, each run here produces a
# distinct, meaningful image version, so runs are queued (not cancelled) rather than dropped.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0
    outputs:
      semver: ${{ steps.gitversion.outputs.semver }}
    steps:
      # actions/checkout is a Node action; the dotnet SDK image doesn't ship Node, and the
      # Forgejo runner doesn't inject one into custom job containers, so install it first
      # (fails otherwise with "exec: node: executable file not found in $PATH").
      - name: Install Node.js
        run: apt-get update && apt-get install -y --no-install-recommends nodejs

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs the full commit history and tags to compute a SemVer - the
          # default shallow (depth 1) checkout only sees the current commit.
          fetch-depth: 0

      # gitversion.tool is already declared in .config/dotnet-tools.json. Zero-config SemVer
      # from the nearest vX.Y.Z tag: a clean version on a tagged commit, a pre-release with
      # commit-height suffix otherwise (e.g. 1.2.4-1 one commit past v1.2.3).
      - name: Compute version (GitVersion)
        id: gitversion
        run: |
          dotnet tool restore
          semver=$(dotnet tool run dotnet-gitversion /showvariable SemVer)
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore CodeRag.sln

      - name: Build
        run: dotnet build CodeRag.sln --no-restore --configuration Release

      # -m:1 forces MSBuild to run test projects one at a time. Several projects
      # (CodeRag.Api.Tests, CodeRag.Infrastructure.Database.Tests, and the OpenAI/Ollama
      # embedding integration tests) spin up Testcontainers-managed Docker containers with
      # large images (pgvector, text-embeddings-inference). Running them in parallel on this
      # runner's shared Docker daemon overloads it while those images pull, and
      # container-create calls for the Postgres-backed tests time out (TaskCanceledException
      # from Docker.DotNet) well before the images finish downloading.
      #
      # The retry is a safety net for the same class of failure at the workflow level: the
      # concurrency block above is a best-effort guard (Forgejo's own docs: "in exceptional
      # circumstances this cannot be guaranteed") against two runs of this workflow landing on
      # the runner at once - e.g. a branch push and a tag push for the same commit dispatched
      # close enough together to race the scheduler. When that happens, Testcontainers' own Ryuk
      # resource-reaper container can time out starting under the extra load, failing otherwise
      # passing tests (TaskCanceledException from DockerContainer.StartAsync). One retry clears
      # a transient contention spike without masking a genuine test regression, which fails both
      # attempts identically.
      - name: Test
        run: |
          for attempt in 1 2; do
            dotnet test CodeRag.sln --no-build --configuration Release -m:1 && exit 0
            echo "::warning::dotnet test failed (attempt $attempt/2) - retrying in case this is Testcontainers/Docker-daemon contention from an overlapping workflow run"
          done
          exit 1

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: self-hosted
    env:
      VERSION: ${{ needs.test.outputs.semver }}
    steps:
      - uses: actions/checkout@v4

      # REGISTRY_IMAGE, REGISTRY_USERNAME are repo/org variables; REGISTRY_PASSWORD is a repo
      # secret (a token with package-write scope for this Forgejo instance's registry).
      - name: Log in to the container registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY }}" -u "${{ vars.REGISTRY_USERNAME }}" --password-stdin

      # The image tag is always the GitVersion-computed SemVer, which is unique per commit
      # (the pre-release commit-height suffix increments even without a new tag) - deploy_tag
      # mirrors it 1:1 so the update-gitops job always sees a diff to sync. `latest` is only
      # added when this run was triggered by pushing a vX.Y.Z tag, not on every main push.
      - name: Determine image tags
        id: tag
        run: |
          tags="${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:${VERSION}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags="$tags ${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          build_args=()
          for t in ${{ steps.tag.outputs.tags }}; do build_args+=(-t "$t"); done
          docker build --build-arg VERSION="${VERSION}" "${build_args[@]}" -f Dockerfile .

      - name: Push image
        run: |
          for t in ${{ steps.tag.outputs.tags }}; do docker push "$t"; done

    outputs:
      deploy_tag: ${{ steps.tag.outputs.deploy_tag }}

  update-gitops:
    needs: publish
    # Only main pushes update the app-of-apps repo - version tags are published but not
    # auto-deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        # The install script uses $GITHUB_TOKEN (if set) to authenticate against the real
        # github.com API - but Forgejo injects its own GITHUB_TOKEN into every job's
        # environment (for GitHub Actions compatibility), which github.com rejects. Clear it
        # for this step only.
        #
        # This runner executes job steps directly on its own filesystem (no per-job
        # container), so /tmp persists across runs - skip reinstalling if a previous run
        # already put a binary there (the script refuses to overwrite one anyway).
        env:
          GITHUB_TOKEN: ""
        run: |
          if [ ! -x /tmp/kustomize-bin/kustomize ]; then
            mkdir -p /tmp/kustomize-bin
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /tmp/kustomize-bin
          fi
          echo "/tmp/kustomize-bin" >> "$GITHUB_PATH"

      - name: Stamp image into manifests
        run: |
          cd .eng/k8s
          kustomize edit set image "code-rag-api=${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:${{ needs.publish.outputs.deploy_tag }}"

      # The runner's job steps execute directly in the (Alpine-based) runner image, which
      # doesn't ship an SSH client.
      - name: Install openssh-client
        run: apk add --no-cache openssh-client

      # ARGO_DEPLOY_SSH_KEY is a repo secret: the private half of a deploy key with write
      # access added to sauron/argo-local-apps in Forgejo (Settings > Deploy keys, "Read and
      # Write" enabled). ssh-keyscan trusts the host on first connect - argo-local-apps and
      # this runner are on the same private network, so TOFU is acceptable here.
      - name: Configure SSH
        run: |
          echo "${{ secrets.ARGO_DEPLOY_SSH_KEY }}" > "${{ github.workspace }}/.ssh-key"
          chmod 600 "${{ github.workspace }}/.ssh-key"
          ssh-keyscan -p 2222 forgejo.home.arpa > "${{ github.workspace }}/.ssh-known-hosts" 2>/dev/null

      - name: Sync manifests to argo-local-apps
        env:
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.ssh-key -o UserKnownHostsFile=${{ github.workspace }}/.ssh-known-hosts
        run: |
          WORKDIR=$(mktemp -d)
          git clone --depth 1 ssh://git@forgejo.home.arpa:2222/sauron/argo-local-apps.git "$WORKDIR"

          rm -rf "$WORKDIR/manifests/code-rag-api"
          mkdir -p "$WORKDIR/manifests/code-rag-api"
          cp -r .eng/k8s/. "$WORKDIR/manifests/code-rag-api/"

          cd "$WORKDIR"
          git config user.name "code-rag-ci"
          git config user.email "ci@code-rag.local"
          git add manifests/code-rag-api

          if git diff --cached --quiet; then
            echo "No manifest changes, skipping commit."
          else
            git commit -m "chore(code-rag): deploy ${{ needs.publish.outputs.deploy_tag }}"
            git push origin main
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f "${{ github.workspace }}/.ssh-key" "${{ github.workspace }}/.ssh-known-hosts"
