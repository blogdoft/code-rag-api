# Mirrors this repository to GitHub on every push (all branches and tags, deleting on the
# GitHub side anything removed here). Requires a Forgejo repo secret configured in
# Settings > Actions > Secrets:
#   MIRROR_GITHUB_TOKEN - a GitHub Personal Access Token (classic, "repo" scope, or
#   fine-grained with "Contents: read and write") for an account with push access to
#   https://github.com/blogdoft/code-rag-api.
name: Mirror to GitHub

on:
  push:
    branches: ["**"]
    tags: ["**"]

# A branch push and a tag push landing close together (e.g. tagging a release right after
# pushing main) each trigger their own run of this job. Without this, two runs can execute
# concurrently and race on the same working directory's refs - one run's tag fetch fails with
# "would clobber existing tag" because the other run is fetching/writing refs at the same time.
# Each run mirrors the full current state of origin regardless of which push triggered it, so
# it's safe (and more efficient) to drop a still-running, now-stale run in favor of the newest.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: |
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git update-ref -d refs/remotes/origin/HEAD 2>/dev/null || true

      - name: Push mirror to GitHub
        run: |
          git push --prune "https://x-access-token:${{ secrets.MIRROR_GITHUB_TOKEN }}@github.com/blogdoft/code-rag-api.git" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
