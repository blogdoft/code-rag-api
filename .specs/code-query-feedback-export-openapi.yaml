openapi: 3.0.4
info:
  title: Code RAG API - code-query-feedback-export contract changes
  description: >-
    Hand-authored, standalone OpenAPI fragment documenting only the endpoint introduced by
    .specs/code-query-feedback-export.md: the new GET .../code-queries/feedback/export endpoint.
    This file is NOT generated by Swashbuckle and is NOT consumed by the build - it exists purely
    as isolated review material for this spec's contract change. The canonical, complete contract
    remains openapi.yaml, regenerated from the running API once this feature is implemented.
  version: 1.0.0
paths:
  '/api/v1/code-queries/feedback/export':
    get:
      tags:
        - Code Query
      summary: Export raw feedback records for a time window (and optionally a single project) as CSV
      description: >-
        Returns a downloadable CSV file with one row per feedback record in
        public.code_query_feedback whose created_at falls within [start_date, end_date], optionally
        restricted to a single project. Unlike GET .../feedback/stats, this endpoint returns raw,
        unaggregated rows ordered by created_at ascending.


        start_date and end_date are both optional, and each side defaults independently of the
        other when omitted (no relative ±N-days derivation like GET .../feedback/stats): a missing
        start_date defaults to the first day of the current UTC month (00:00 UTC), and a missing
        end_date defaults to now (UTC). When neither is given, the effective window is "start of
        the current month through now". The effective window (end_date - start_date, after
        defaults are applied) must not exceed 366 days (12 months); exceeding it is a 400, as is an
        effective start_date after end_date.


        Column order: id, project_id, project_name, question, useful, similarities, reason,
        username, created_at. project_name is not a column of code_query_feedback - it is obtained
        via a join with projects, included for readability. similarities is rendered as a JSON
        array string within its CSV cell (e.g. "[0.91,0.87,0.75]"). Fields that may contain commas,
        quotes or newlines (question, reason) are RFC 4180 quoted/escaped.
      parameters:
        - name: start_date
          in: query
          description: >-
            Inclusive lower bound (UTC, ISO 8601) of the export window. Optional - defaults to the
            first day of the current UTC month (00:00 UTC) when omitted. See the endpoint
            description for how this combines with end_date and the 366-day maximum window size.
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: >-
            Inclusive upper bound (UTC, ISO 8601) of the export window. Optional - defaults to now
            (UTC) when omitted. Must not be before the effective start_date, and the effective
            window (end_date - start_date) must not exceed 366 days (12 months); either violation
            is a 400.
          required: false
          schema:
            type: string
            format: date-time
        - name: project_id
          in: query
          description: >-
            Restrict the export to a single project, instead of all registered projects. Must
            correspond to the id field returned by GET /projects; a project_id that does not match
            any project results in a 404.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: >-
            CSV file with one row per feedback record in the requested window (and project, if
            given), ordered by created_at ascending. Returned with Content-Disposition: attachment
            so browsers/clients trigger a file download.
          headers:
            Content-Disposition:
              description: >-
                attachment; filename="feedback_export_{start_date:yyyyMMdd}_{end_date:yyyyMMdd}
                [_project-{project_id}].csv" - the _project-{id} suffix is present only when
                project_id was given.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            start_date or end_date is not a valid date-time, the effective start_date (after
            defaults are applied) is after the effective end_date, or the effective window exceeds
            366 days. This is the only client-error condition other than 404 under which this
            endpoint fails.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            project_id was given but does not correspond to any registered project. This is the
            only condition under which this endpoint returns 404; the response has no body.
        '500':
          description: >-
            An unhandled exception occurred while processing the request. This is the only
            condition under which this endpoint returns 500.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServerErrorProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
    ServerErrorProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        exception:
          $ref: '#/components/schemas/ExceptionDetails'
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
    ExceptionDetails:
      type: object
      properties:
        exception_type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        stack_trace:
          type: string
          nullable: true
      additionalProperties: false
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
tags:
  - name: Code Query
    description: Operations for querying indexed source code using natural language.
