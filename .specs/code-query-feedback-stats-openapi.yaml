openapi: 3.0.4
info:
  title: Code RAG API - code-query-feedback-stats contract changes
  description: >-
    Hand-authored, standalone OpenAPI fragment documenting only the endpoint introduced by
    .specs/code-query-feedback-stats.md: the new GET .../code-queries/feedback/stats endpoint.
    This file is NOT generated by Swashbuckle and is NOT consumed by the build - it exists purely
    as isolated review material for this spec's contract change. The canonical, complete contract
    remains openapi.yaml, regenerated from the running API once this feature is implemented.
  version: 1.0.0
paths:
  '/api/v1/code-queries/feedback/stats':
    get:
      tags:
        - Code Query
      summary: Get feedback effectiveness statistics, grouped by week and by project
      description: >-
        Returns feedback effectiveness statistics for a time window (up to 12 months), broken
        down into a dense weekly × project grid: every ISO calendar week (Monday-Sunday)
        overlapping the window is included, and within every week, every registered project (or
        the single project matching project_id, if given) is included, even when it has zero
        feedback in that specific week. Each project entry within a week reports useful vs.
        not-useful counts and percentages for feedback created in that week.


        start_date and end_date are both optional and independent. When neither is given, the
        window defaults to the last 30 days ending now (UTC). When only one is given, the other
        end of the window is derived as a 30-day span from the given value (start_date + 30 days,
        or end_date - 30 days). When both are given, the exact window requested is used.
        start_date after end_date is a 400. The effective window (end_date - start_date) must not
        exceed 366 days (12 months); exceeding it is also a 400.
      parameters:
        - name: start_date
          in: query
          description: >-
            Inclusive lower bound (UTC, ISO 8601) of the time window to aggregate feedback over.
            Optional - see the endpoint description for the default-window rules that apply when
            this and/or end_date are omitted, and for the 366-day maximum window size.
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: >-
            Inclusive upper bound (UTC, ISO 8601) of the time window to aggregate feedback over.
            Optional - see the endpoint description for the default-window rules that apply when
            this and/or start_date are omitted, and for the 366-day maximum window size.
          required: false
          schema:
            type: string
            format: date-time
        - name: project_id
          in: query
          description: >-
            Restrict every week's project list to a single project, instead of all registered
            projects. Must correspond to the id field returned by GET /projects; a project_id that
            does not match any project results in a 404.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: >-
            Feedback statistics for the requested time window, as a dense grid of every week
            overlapping the window, each containing every registered project (or a single project
            when project_id was given), with zero-filled entries where there was no feedback.
            start_date/end_date in the response body reflect the effective window actually used,
            including when derived by default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeQueryFeedbackStatsResponse'
        '400':
          description: >-
            start_date or end_date is not a valid date-time, start_date is after end_date when
            both are given, or the effective window exceeds 366 days. This is the only
            client-error condition other than 404 under which this endpoint fails.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            project_id was given but does not correspond to any registered project. This is the
            only condition under which this endpoint returns 404; the response has no body.
        '500':
          description: >-
            An unhandled exception occurred while processing the request. This is the only
            condition under which this endpoint returns 500.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServerErrorProblemDetails'
components:
  schemas:
    CodeQueryFeedbackStatsResponse:
      type: object
      properties:
        start_date:
          type: string
          format: date-time
          description: Effective inclusive lower bound (UTC) of the aggregated window.
        end_date:
          type: string
          format: date-time
          description: Effective inclusive upper bound (UTC) of the aggregated window.
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyFeedbackStatsResponse'
          description: >-
            Every ISO calendar week (Monday-Sunday) overlapping the effective window, ordered by
            week_start ascending. Always includes every overlapping week, even ones with zero
            feedback across all projects.
      additionalProperties: false
      description: >-
        Feedback effectiveness statistics for a time window, as a dense week × project grid.
        Serializes as snake_case.
    WeeklyFeedbackStatsResponse:
      type: object
      properties:
        week_start:
          type: string
          format: date
          description: Monday of this ISO calendar week.
        week_end:
          type: string
          format: date
          description: Sunday of this ISO calendar week.
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFeedbackStatsResponse'
          description: >-
            Every registered project (or the single project matching project_id, if given),
            ordered by project_id, with counts/percentages for feedback created within this week
            and within the overall requested window. Zero-filled when a project had no feedback
            in this specific week.
      additionalProperties: false
      description: Feedback effectiveness statistics for a single ISO calendar week.
    ProjectFeedbackStatsResponse:
      type: object
      properties:
        project_id:
          type: integer
          format: int64
          description: Id of the project these statistics belong to.
        project_name:
          type: string
          description: Name of the project these statistics belong to.
        total_count:
          type: integer
          format: int64
          description: Total number of feedback records for this project within this week.
        useful_count:
          type: integer
          format: int64
          description: Number of feedback records with useful = true within this week.
        not_useful_count:
          type: integer
          format: int64
          description: Number of feedback records with useful = false within this week.
        useful_percentage:
          type: number
          format: double
          description: >-
            useful_count as a percentage of total_count for this week, rounded to 2 decimal
            places. 0 when total_count is 0.
        not_useful_percentage:
          type: number
          format: double
          description: >-
            not_useful_count as a percentage of total_count for this week, rounded to 2 decimal
            places. 0 when total_count is 0.
      additionalProperties: false
      description: Feedback effectiveness statistics for a single project within a single week.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
    ServerErrorProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        exception:
          $ref: '#/components/schemas/ExceptionDetails'
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
    ExceptionDetails:
      type: object
      properties:
        exception_type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        stack_trace:
          type: string
          nullable: true
      additionalProperties: false
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
tags:
  - name: Code Query
    description: Operations for querying indexed source code using natural language.
