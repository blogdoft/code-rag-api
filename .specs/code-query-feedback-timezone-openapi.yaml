openapi: 3.0.4
info:
  title: Code RAG API - code-query-feedback-timezone contract changes
  description: >-
    Hand-authored, standalone OpenAPI fragment documenting only the contract change introduced by
    .specs/code-query-feedback-timezone.md: a new optional `timezone` query parameter on the
    already-existing GET .../code-queries/feedback/export endpoint. CHANGE ONLY - see openapi.yaml
    for this endpoint's full documentation (start_date/end_date/project_id parameters and the
    200/404/500 responses are unchanged by this fragment). This file is NOT generated by
    Swashbuckle and is NOT consumed by the build - it exists purely as isolated review material for
    this spec's contract change, and as the single source of truth both the code-rag-api backend
    and the code-rag-front UI implement against. The canonical, complete contract remains
    openapi.yaml, regenerated from the running API once this feature is implemented.
  version: 1.0.0
paths:
  '/api/v1/code-queries/feedback/export':
    get:
      tags:
        - Code Query
      summary: CHANGE ONLY - adds an optional timezone query parameter
      description: >-
        CHANGE ONLY - see openapi.yaml for this endpoint's full documentation. start_date, end_date,
        project_id, and the 200/404/500 responses are unchanged by this fragment.


        This fragment documents only the new `timezone` parameter: when given, the created_at
        column of the returned CSV is rendered in that IANA zone's local wall-clock time with an
        explicit UTC offset (e.g. "2026-09-03T20:47:20-03:00") instead of UTC ("...Z"). start_date,
        end_date, and the default-window rules (start of current UTC month / now) are unaffected by
        timezone - they remain UTC-based regardless of this parameter. An unrecognized IANA
        timezone name is a 400.
      parameters:
        - name: timezone
          in: query
          description: >-
            IANA timezone name (e.g. "America/Sao_Paulo", "America/Manaus", "America/Rio_Branco",
            "America/Noronha") used to render the created_at column of the CSV in that zone's local
            wall-clock time, with an explicit UTC offset suffix. Optional - when omitted,
            created_at keeps its current UTC rendering (a "Z" suffix). Does not affect start_date/
            end_date filtering or the default-window rules, which stay UTC-based regardless. An
            unrecognized IANA name results in a 400.
          required: false
          schema:
            type: string
            example: America/Sao_Paulo
      responses:
        '400':
          description: >-
            CHANGE ONLY - adds one new cause to the endpoint's existing 400: timezone was given but
            is not a name recognized by the IANA time zone database. The pre-existing 400 causes
            (malformed start_date/end_date, effective start_date after end_date, effective window
            exceeding 366 days) are unchanged - see openapi.yaml.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
tags:
  - name: Code Query
    description: Operations for querying indexed source code using natural language.
