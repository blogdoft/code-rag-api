openapi: 3.0.4
info:
  title: Code RAG API - query-feedback contract changes
  description: >-
    Hand-authored, standalone OpenAPI fragment documenting only the endpoint changes introduced
    by .specs/query-feedback.md: the new POST .../code-queries/feedback endpoint, and the new
    409 response added to DELETE /api/v1/projects/{projectId}. This file is NOT generated by
    Swashbuckle and is NOT consumed by the build - it exists purely as isolated review material
    for this spec's contract change. The canonical, complete contract remains openapi.yaml,
    regenerated from the running API once this feature is implemented.
  version: 1.0.0
paths:
  '/api/v1/projects/{projectId}/code-queries/feedback':
    post:
      tags:
        - Code Query
      summary: Submit feedback on a prior code query
      description: >-
        Records whether a previous POST .../code-queries call's results were useful, so
        effectiveness can be measured later. Callable by a human (REST) or an AI agent (MCP,
        via the submit_code_query_feedback tool). The caller must always identify itself via
        the required `user` field - for MCP callers this is the calling agent/tool's own name
        (e.g. "claude code", "codex", "crewai", "hermes", "opencode"), never a guess or a
        default.


        There is no corresponding GET endpoint for feedback in this iteration - effectiveness
        is computed directly against the database out of band. Accordingly, the 201 response
        has no Location header, unlike POST /projects.
      parameters:
        - name: projectId
          in: path
          description: >-
            Identifier of the project the original code-queries call was scoped to, corresponding
            to the `id` field returned by `GET /projects`. Must be a positive 64-bit integer; any
            other format (e.g. a GUID or non-numeric string) results in a 400 response.
          required: true
          schema:
            type: string
      requestBody:
        description: The original question, whether it was useful, the similarity values it returned, and the identity of the caller submitting the feedback.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeQueryFeedbackRequest'
      responses:
        '201':
          description: >-
            The feedback was recorded. The response body echoes the persisted record, including
            its generated `id` and `created_at`. There is no `Location` header - no GET-by-id
            endpoint exists for feedback in this iteration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeQueryFeedbackResponse'
        '400':
          description: >-
            The projectId path parameter is not a valid positive integer, or the request body is
            missing/malformed, or `question`/`useful`/`similarities`/`user` is missing or invalid
            (empty, blank, exceeds its maximum length/count), or `reason` exceeds its maximum
            length.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            No project exists with the given projectId. This is the only condition under which
            this endpoint returns 404; the response has no body.
        '500':
          description: >-
            An unhandled exception occurred while processing the request. This is the only
            condition under which this endpoint returns 500.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServerErrorProblemDetails'
  /api/v1/projects/{projectId}:
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: >-
        CHANGE ONLY - see openapi.yaml for the full endpoint documentation. This fragment adds
        one new failure condition to the existing 409 response: deleting a project that has
        feedback records (from POST .../code-queries/feedback) now also fails with 409, mirroring
        the existing indexed-code-documents check. Remove the project's feedback records first
        (out of scope for this API's endpoints in this iteration - direct database access only).
      responses:
        '409':
          description: >-
            The project has one or more indexed code documents, OR one or more feedback records,
            and cannot be deleted. This is the only condition under which this endpoint returns
            409.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    CodeQueryFeedbackRequest:
      type: object
      properties:
        question:
          type: string
          description: "The natural language question that was originally sent to `POST .../code-queries`. Must\nnot be empty or blank."
          nullable: true
        useful:
          type: boolean
          description: Whether the results returned for `question` were useful to the caller.
          nullable: true
        similarities:
          type: array
          items:
            type: number
            format: double
          description: "The exact `similarity` values (not `rerankScore`) returned by the original\ncode-queries call, in the order they were received. May be an empty array when the query\nreturned zero results."
          nullable: true
        reason:
          type: string
          description: "Optional free-text explanation of why the results were not useful. Not required even when\n`useful` is false."
          nullable: true
        user:
          type: string
          description: "Identity of the caller submitting this feedback. For a human caller, their own identifier\n(e.g. a username). For an MCP caller, the name of the calling agent/tool itself (e.g.\n\"claude code\", \"codex\", \"crewai\", \"hermes\", \"opencode\") - never omitted or guessed."
          nullable: true
      additionalProperties: false
      description: 'Feedback on a prior `POST .../code-queries` call, scoped to a single project.'
    CodeQueryFeedbackResponse:
      type: object
      properties:
        id:
          type: integer
          description: 'Auto-generated, unique identifier of the feedback record.'
          format: int64
        project_id:
          type: integer
          description: Id of the project the original code query was scoped to.
          format: int64
        question:
          type: string
          description: The natural language question that was originally sent to `POST .../code-queries`.
          nullable: true
        useful:
          type: boolean
          description: Whether the results returned for `question` were useful to the caller.
        similarities:
          type: array
          items:
            type: number
            format: double
          description: 'The exact `similarity` values returned by the original code-queries call, as submitted.'
          nullable: true
        reason:
          type: string
          description: 'Free-text explanation of why the results were not useful, if provided.'
          nullable: true
        user:
          type: string
          description: 'Identity of the caller who submitted this feedback (human username, or MCP agent/tool name).'
          nullable: true
        created_at:
          type: string
          description: Timestamp (UTC) at which the feedback record was created.
          format: date-time
      additionalProperties: false
      description: "A recorded piece of feedback on a prior code query. Serializes as snake_case. There is no GET\nendpoint for retrieving it later in this iteration - this response is the only view of it."
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
    ServerErrorProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        exception:
          $ref: '#/components/schemas/ExceptionDetails'
      additionalProperties: { }
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
    ExceptionDetails:
      type: object
      properties:
        exception_type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        stack_trace:
          type: string
          nullable: true
      additionalProperties: false
      description: Reproduced from openapi.yaml for this fragment's own $ref resolution.
tags:
  - name: Code Query
    description: Operations for querying indexed source code using natural language.
  - name: Projects
    description: 'CRUD operations for registering, discovering, renaming, and removing indexed projects.'
